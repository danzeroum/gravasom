name: CI

# Gatilho unico: push (main, claude/**) e tags v*. Os checks do push aparecem no PR quando a branch e do mesmo repositorio;
# por isso NAO ha gatilho pull_request (rodava a CI inteira duas vezes por commit).
# Os testes caros (emuladores, harness de audio) so rodam quando o que eles cobrem muda, ou em main e em tags v*.
# O filtro esta no job "mudancas" (docs/status.md, secao "Filtro de caminhos da CI"): nao desfazer sem medir.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  # Medicoes caras (spike de transcricao, ADR-013) rodam so sob demanda.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide o que rodar. Falha ABERTA: se o filtro nao conseguir comparar (ex.: force-push), tudo roda.
  mudancas:
    name: mudancas (filtro de caminhos)
    runs-on: ubuntu-latest
    outputs:
      audio: ${{ steps.filtro.outcome != 'success' && 'true' || steps.filtro.outputs.audio }}
      app: ${{ steps.filtro.outcome != 'success' && 'true' || steps.filtro.outputs.app }}
      benchmark: ${{ steps.filtro.outcome != 'success' && 'true' || steps.filtro.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
      # dorny/paths-filter v4.0.3, fixado por SHA. Compara com o commit anterior ao push (nao com a main), para que um commit
      # so de docs nao herde "mudou codigo" de commits antigos da branch. Branch nova (before = zeros): compara com a main.
      - id: filtro
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'main' }}
          filters: |
            audio:
              - 'core/audio-*/**'
              - 'core/dsp/**'
              - 'corpus/**'
              - 'perfis/**'
              - 'scripts/**'
              - '.github/audio-suite.sha'
            benchmark:
              - 'app/**'
              - 'feature/player/**'
              - 'core/audio-engine/**'
              - 'core/service/**'
              - 'macrobenchmark/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'config/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
              - '.github/scripts/ci-instrumentados.sh'

  lint-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew detekt --no-daemon
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Semgrep (OWASP MASVS)
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --error --quiet || true

  testes-unidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes + cobertura
        run: ./gradlew testDebugUnitTest koverVerify --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: '**/build/reports/**'

  build:
    runs-on: ubuntu-latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release (R8)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

  harness-audio-suite:
    name: harness audio-suite (calibracao e controles positivos)
    needs: [mudancas]
    if: needs.mudancas.outputs.audio == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ESTUDIO_EXIGIR_AUDIO_SUITE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias do sistema (ffmpeg para converter o corpus)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: audio-suite isolado (pipx, pinado por SHA)
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx install "git+https://github.com/danzeroum/audio-suite@$(cat .github/audio-suite.sha)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache do corpus (baixado por hash)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gravasom-corpus
          key: corpus-${{ hashFiles('corpus/corpus.sha256') }}
      - name: Gerar corpus, saidas boas e controles
        run: scripts/corpus-tudo.sh tests-out/corpus
      - name: Verificar tetos (bons passam, controles reprovam)
        run: |
          mkdir -p evidencias-ci
          set -o pipefail
          python3 -I scripts/calibrar_tetos.py verificar perfis/gravasom-fala.yaml tests-out/corpus perfis/tetos.json | tee evidencias-ci/verificar-tetos.log
      - name: Medidor com referencia (venv SEPARADO do audio-suite; pystoi/numpy/scipy fixos)
        run: |
          python3 -m venv .venv-medidas
          .venv-medidas/bin/pip install -q -r scripts/requirements-medidas.txt
          set -o pipefail
          .venv-medidas/bin/python scripts/calibrar_ref.py verificar tests-out/corpus perfis/tetos_ref.json | tee evidencias-ci/verificar-ref.log
      - name: Kit de escuta A/B cego (bases reais)
        run: scripts/kit-escuta.sh tests-out/corpus hp80 tests-out/kit-escuta 1
      - name: Estados do audio-suite (VERDE/VERMELHO) sobre amostras
        run: |
          set -o pipefail
          {
            scripts/audio-suite-gate.sh perfis/gravasom-fala.yaml tests-out/corpus/real_fala_1__hp80.wav tests-out/corpus/real_fala_1.wav
            ! scripts/audio-suite-gate.sh perfis/gravasom-fala.yaml tests-out/corpus/real_fala_1__ctrl_ganho3db_clip.wav
          } 2>&1 | tee evidencias-ci/estados.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-audio-suite
          path: |
            evidencias-ci/
            tests-out/corpus/*__hp80.wav
            tests-out/corpus/*__ctrl_*.wav
            tests-out/corpus/fala_sintetica.wav
            tests-out/kit-escuta/
          if-no-files-found: warn

  harness-vad:
    name: harness do VAD (fala pt-BR com ruido, ADR-014)
    needs: [mudancas]
    if: needs.mudancas.outputs.audio == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: ffmpeg e numpy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user numpy==2.5.3
      - name: Cache do corpus (baixado por hash)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gravasom-corpus
          key: corpus-${{ hashFiles('corpus/corpus.sha256') }}
      - name: Testes do VAD nativo no host (ASan/UBSan)
        run: scripts/test-vad-host.sh
      - name: Fala pt-BR por hash e corpus com ruido
        run: |
          scripts/corpus-pt.sh tests-out/pt vad
          python3 -I scripts/vad_corpus.py tests-out/pt corpus/falas_pt_vad.txt tests-out/vad-corpus
      - name: Kotlin + JNI sobre o corpus (mede fala cortada e tempo economizado)
        run: |
          HOST_LIB="$(scripts/build-dsp-host.sh "$PWD/tests-out/dsp-host")"
          mkdir -p evidencias-ci
          export GRAVASOM_DSP_HOST_LIB="$HOST_LIB" GRAVASOM_VAD_CORPUS="$PWD/tests-out/vad-corpus" GRAVASOM_VAD_REPORT="$PWD/evidencias-ci/vad-relatorio.tsv"
          ./gradlew :core:dsp:testDebugUnitTest --no-daemon
          python3 -I scripts/vad_resumo.py evidencias-ci/vad-relatorio.tsv | tee evidencias-ci/vad-resumo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-vad
          path: evidencias-ci/

  macrobenchmark-onda:
    name: macrobenchmark da onda (pinca em 1 h, API 34)
    needs: [mudancas]
    if: needs.mudancas.outputs.benchmark == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Macrobenchmark no emulador (so informa, pois o emulador renderiza por software)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: >-
            ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest --no-daemon --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY
            -Pandroid.testInstrumentationRunnerArguments.class=com.gravasom.macrobenchmark.ZoomOndaBenchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macrobenchmark-onda
          path: |
            macrobenchmark/build/outputs/connected_android_test_additional_output/
            macrobenchmark/build/reports/androidTests/
          if-no-files-found: warn

  spike-transcricao:
    name: spike de transcricao (WER pt-BR no host, ADR-013)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg cmake g++
          python3 -m pip install --user numpy==2.5.3 jiwer==3.1.0
      - name: Cache do corpus e dos modelos (baixados por hash)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gravasom-corpus
          key: spike-${{ hashFiles('corpus/corpus.sha256', 'corpus/modelos.sha256') }}
      - name: Fonte do whisper.cpp e modelos por hash
        run: |
          spike/whisper/scripts/buscar-whisper.sh "$PWD/tests-out/whisper-src"
          spike/whisper/scripts/buscar-modelos.sh "$HOME/.cache/gravasom-corpus/modelos"
      - name: Compilar whisper-cli (host)
        run: |
          cmake -S tests-out/whisper-src -B tests-out/whisper-build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build tests-out/whisper-build -j"$(nproc)" --target whisper-cli
      - name: WER, tempo e memoria dos 4 modelos
        run: |
          scripts/corpus-pt.sh tests-out/pt asr
          mkdir -p evidencias-ci
          M="$HOME/.cache/gravasom-corpus/modelos"
          python3 -I scripts/asr_spike.py tests-out/pt corpus/falas_pt_asr.txt tests-out/whisper-build/bin/whisper-cli evidencias-ci/asr-host.json \
            "$M/ggml-tiny-q5_1.bin" "$M/ggml-tiny.bin" "$M/ggml-base-q5_1.bin" "$M/ggml-base.bin"
          cat evidencias-ci/asr-host.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-transcricao
          path: evidencias-ci/

  apk:
    name: APK de debug (gravasom-apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar app-debug.apk
        run: |
          mkdir -p evidencias-ci
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -15 | tee evidencias-ci/apk-build.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          { echo "arquivo=$APK"; echo "bytes=$(stat -c %s $APK)"; echo "sha256=$(sha256sum $APK | cut -d' ' -f1)"; } | tee evidencias-ci/apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gravasom-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidencias-ci/apk-info.txt
          if-no-files-found: error

  release-apk:
    name: APK de release assinado (gravasom-release-apk)
    runs-on: ubuntu-latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar, assinar e verificar (falha sem segredos ou acima de 25 MB)
        env:
          GRAVASOM_KEYSTORE_BASE64: ${{ secrets.GRAVASOM_KEYSTORE_BASE64 }}
          GRAVASOM_KEYSTORE_PASSWORD: ${{ secrets.GRAVASOM_KEYSTORE_PASSWORD }}
          GRAVASOM_KEY_ALIAS: ${{ secrets.GRAVASOM_KEY_ALIAS }}
          GRAVASOM_KEY_PASSWORD: ${{ secrets.GRAVASOM_KEY_PASSWORD }}
          # versionCode cresce a cada execucao (o APK novo instala por cima do anterior); o nome vem da tag vX.Y.Z.
          GRAVASOM_VERSION_CODE: ${{ github.run_number }}
          GRAVASOM_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: bash .github/scripts/release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gravasom-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            evidencias-ci/apk-release-info.txt
            evidencias-ci/apk-release-certificado.txt
          if-no-files-found: error

  instrumentados:
    name: instrumentados (API ${{ matrix.api }})
    needs: [mudancas]
    if: needs.mudancas.outputs.app == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache do AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-x86_64-v1
      - name: Criar AVD e snapshot (cache frio)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD gerado"
      - name: Testes instrumentados no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/ci-instrumentados.sh ${{ matrix.api }}
      - name: Enviar logs e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentados-api${{ matrix.api }}
          path: |
            evidencias-ci/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  release:
    name: GitHub Release (APK assinado + SHA-256)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-apk, testes-unidade]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gravasom-release-apk
          path: release-apk
      - name: Publicar a Release (so chega aqui com o APK assinado, pois o job release-apk falha sem os segredos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSAO="${GITHUB_REF_NAME#v}"
          ARQ="gravasom-${VERSAO}.apk"
          cp release-apk/app/build/outputs/apk/release/app-release.apk "$ARQ"
          sha256sum "$ARQ" > "${ARQ}.sha256"
          gh release create "$GITHUB_REF_NAME" "$ARQ" "${ARQ}.sha256" release-apk/evidencias-ci/apk-release-info.txt \
            --repo "$GITHUB_REPOSITORY" --title "Gravasom ${VERSAO}" \
            --notes "APK assinado (mesma chave de sempre: instala por cima da versao anterior sem perder gravacoes). SHA-256 em ${ARQ}.sha256. Verificacao pela CI (testes, lint, orcamento de 25 MB); validacao no aparelho e do dono (docs/uso.md)."
