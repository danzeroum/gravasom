name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew detekt --no-daemon
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Semgrep (OWASP MASVS)
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --error --quiet || true

  testes-unidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes + cobertura
        run: ./gradlew testDebugUnitTest koverVerify --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: '**/build/reports/**'

  build:
    runs-on: ubuntu-latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release (R8)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

  instrumentados:
    name: instrumentados (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache do AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-x86_64-v1
      - name: Criar AVD e snapshot (cache frio)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD gerado"
      - name: Testes instrumentados no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/ci-instrumentados.sh ${{ matrix.api }}
      - name: Enviar logs e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentados-api${{ matrix.api }}
          path: |
            evidencias-ci/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publicar no canal interno
        run: ./gradlew publishReleaseBundle --no-daemon
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
