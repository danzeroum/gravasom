name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-estatica:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detekt
        run: ./gradlew detekt --no-daemon
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Semgrep (OWASP MASVS)
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --error --quiet || true

  testes-unidade:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes + cobertura
        run: ./gradlew testDebugUnitTest koverVerify --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: '**/build/reports/**'

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release (R8)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

  instrumentados:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    container: ghcr.io/cirruslabs/android-sdk:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle Managed Devices (API 26, 30, 34, 36)
        run: ./gradlew pixel2api26DebugAndroidTest pixel2api30DebugAndroidTest pixel2api34DebugAndroidTest pixel2api36DebugAndroidTest --no-daemon

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container: ghcr.io/cirruslabs/android-sdk:latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publicar no canal interno
        run: ./gradlew publishReleaseBundle --no-daemon
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
