name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew detekt --no-daemon
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Semgrep (OWASP MASVS)
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --error --quiet || true

  testes-unidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes + cobertura
        run: ./gradlew testDebugUnitTest koverVerify --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: '**/build/reports/**'

  build:
    runs-on: ubuntu-latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release (R8)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

  harness-audio-suite:
    name: harness audio-suite (calibracao e controles positivos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ESTUDIO_EXIGIR_AUDIO_SUITE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias do sistema (ffmpeg para converter o corpus)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: audio-suite isolado (pipx, pinado por SHA)
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx install "git+https://github.com/danzeroum/audio-suite@$(cat .github/audio-suite.sha)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache do corpus (baixado por hash)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gravasom-corpus
          key: corpus-${{ hashFiles('corpus/corpus.sha256') }}
      - name: Gerar corpus, saidas boas e controles
        run: scripts/corpus-tudo.sh tests-out/corpus
      - name: Verificar tetos (bons passam, controles reprovam)
        run: |
          mkdir -p evidencias-ci
          set -o pipefail
          python3 -I scripts/calibrar_tetos.py verificar perfis/gravasom-fala.yaml tests-out/corpus perfis/tetos.json | tee evidencias-ci/verificar-tetos.log
      - name: Medidor com referencia (venv SEPARADO do audio-suite; pystoi/numpy/scipy fixos)
        run: |
          python3 -m venv .venv-medidas
          .venv-medidas/bin/pip install -q -r scripts/requirements-medidas.txt
          set -o pipefail
          .venv-medidas/bin/python scripts/calibrar_ref.py verificar tests-out/corpus perfis/tetos_ref.json | tee evidencias-ci/verificar-ref.log
      - name: Kit de escuta A/B cego (bases reais)
        run: scripts/kit-escuta.sh tests-out/corpus hp80 tests-out/kit-escuta 1
      - name: Estados do audio-suite (VERDE/VERMELHO) sobre amostras
        run: |
          set -o pipefail
          {
            scripts/audio-suite-gate.sh perfis/gravasom-fala.yaml tests-out/corpus/real_fala_1__hp80.wav tests-out/corpus/real_fala_1.wav
            ! scripts/audio-suite-gate.sh perfis/gravasom-fala.yaml tests-out/corpus/real_fala_1__ctrl_ganho3db_clip.wav
          } 2>&1 | tee evidencias-ci/estados.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-audio-suite
          path: |
            evidencias-ci/
            tests-out/corpus/*__hp80.wav
            tests-out/corpus/*__ctrl_*.wav
            tests-out/corpus/fala_sintetica.wav
            tests-out/kit-escuta/
          if-no-files-found: warn

  apk:
    name: APK de debug (gravasom-apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar app-debug.apk
        run: |
          mkdir -p evidencias-ci
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -15 | tee evidencias-ci/apk-build.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          { echo "arquivo=$APK"; echo "bytes=$(stat -c %s $APK)"; echo "sha256=$(sha256sum $APK | cut -d' ' -f1)"; } | tee evidencias-ci/apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gravasom-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidencias-ci/apk-info.txt
          if-no-files-found: error

  release-apk:
    name: APK de release assinado (gravasom-release-apk)
    runs-on: ubuntu-latest
    needs: [lint-estatica, testes-unidade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar, assinar e verificar (falha sem segredos ou acima de 25 MB)
        env:
          GRAVASOM_KEYSTORE_BASE64: ${{ secrets.GRAVASOM_KEYSTORE_BASE64 }}
          GRAVASOM_KEYSTORE_PASSWORD: ${{ secrets.GRAVASOM_KEYSTORE_PASSWORD }}
          GRAVASOM_KEY_ALIAS: ${{ secrets.GRAVASOM_KEY_ALIAS }}
          GRAVASOM_KEY_PASSWORD: ${{ secrets.GRAVASOM_KEY_PASSWORD }}
        run: bash .github/scripts/release-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gravasom-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            evidencias-ci/apk-release-info.txt
            evidencias-ci/apk-release-certificado.txt
          if-no-files-found: error

  instrumentados:
    name: instrumentados (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache do AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-x86_64-v1
      - name: Criar AVD e snapshot (cache frio)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD gerado"
      - name: Testes instrumentados no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/ci-instrumentados.sh ${{ matrix.api }}
      - name: Enviar logs e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentados-api${{ matrix.api }}
          path: |
            evidencias-ci/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publicar no canal interno
        run: ./gradlew publishReleaseBundle --no-daemon
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
