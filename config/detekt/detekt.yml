# Config do Detekt ajustada ao contexto do Gravasom.
# Regras que geram ruido sem valor aqui:
#  - FunctionNaming em @Composable (convencao da UI e PascalCase)
#  - MagicNumber em constantes de protocolo (RIFF) e conversoes (1000 ms/s)
#  - TooManyFunctions em DAO/Repository (o contrato exige muitos metodos)
# O que importa (complexidade, bugs potenciais, coroutines) fica ativo.

build:
  maxIssues: 0

complexity:
  active: true
  CyclomaticComplexMethod:
    threshold: 10
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  NestedBlockDepth:
    threshold: 4
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    active: true

naming:
  active: true
  FunctionNaming:
    active: false

potential-bugs:
  active: true

coroutines:
  active: true
